{% extends "base.html" %}

{% block content %}

<div class="container">

    <h1>Log Fitness Activity</h1>

    <p>Record your daily fitness activity below.</p>

    <form method="POST">

        <div>
            <label for="date">Date</label>
            <input
                type="date"
                id="date"
                name="date"
                required
            >
        </div>

        <br>

        <div>
            <label for="steps">Steps</label>
            <input
                type="number"
                id="steps"
                name="steps"
                min="0"
                placeholder="Example: 8000"
                required
            >
        </div>

        <br>

        <div>
            <label for="workout_type">Workout Type</label>
            <input
                type="text"
                id="workout_type"
                name="workout_type"
                placeholder="Example: Walking, Running, Gym"
                required
            >
        </div>

        <br>

        <div>
            <label for="duration">Workout Duration (minutes)</label>
            <input
                type="number"
                id="duration"
                name="duration"
                min="0"
                placeholder="Example: 30"
                required
            >
        </div>

        <br>

        <div>
            <label for="calories_burned">Calories Burned</label>
            <input
                type="number"
                id="calories_burned"
                name="calories_burned"
                min="0"
                placeholder="Example: 250"
                required
            >
        </div>

        <br>

        <button type="submit">Save Activity</button>

    </form>

</div>

{% endblock %}
